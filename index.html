<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feliz Día de San Valentín</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9aa2, #ffb7b2, #ffdfba);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      overflow-x: hidden;
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 15px;
      position: relative;
      text-align: center;
    }

    .container::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #ffffff18, transparent 70%);
      pointer-events: none;
    }

    h1 {
      font-size: clamp(2.3rem, 7vw, 5.5rem);
      margin-bottom: 0.3em;
      text-shadow: 0 0 20px rgba(255, 50, 100, 0.7);
      animation: glow 2.5s ease-in-out infinite alternate;
    }

    .name {
      font-size: clamp(3.2rem, 9vw, 7.5rem);
      font-weight: bold;
      color: #ff3366;
      margin: 0.3em 0 0.6em;
      text-shadow: 0 0 30px rgba(255, 50, 100, 0.9);
    }

    .message {
      font-size: clamp(1.25rem, 4vw, 2rem);
      max-width: 90%;
      line-height: 1.5;
      margin: 1.5em 0 2.5em;
      opacity: 0.95;
    }

    /* ===== CORAZÓN PERFECTO ===== */
    .heart-container {
      width: 200px;
      height: 180px;
      margin: 2.5em auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .heart {
      position: relative;
      width: 120px;
      height: 110px;
      background: #ff3366;
      transform: rotate(-45deg);
      animation: heartbeat 1.5s infinite;
      box-shadow: 0 15px 40px rgba(255, 50, 100, 0.6);
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 110px;
      background: #ff3366;
      border-radius: 50%;
    }

    .heart::before {
      top: -60px;
      left: 0;
    }

    .heart::after {
      left: 60px;
      top: 0;
    }

    @keyframes heartbeat {
      0%   { transform: rotate(-45deg) scale(1); }
      25%  { transform: rotate(-45deg) scale(1.08); }
      40%  { transform: rotate(-45deg) scale(1); }
      60%  { transform: rotate(-45deg) scale(1.12); }
      100% { transform: rotate(-45deg) scale(1); }
    }

    /* Pétalos */
    .petals {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 5;
    }

    .petal {
      position: absolute;
      width: 14px;
      height: 14px;
      background: radial-gradient(circle at 30% 30%, #ffcccc, #ff3366);
      border-radius: 40% 0 60% 50% / 60% 40% 70% 40%;
      opacity: 0.8;
      animation: fall linear infinite;
      box-shadow: 0 0 8px rgba(255, 50, 100, 0.5);
    }

    @keyframes fall {
      from { transform: translateY(-120vh) rotate(0deg); }
      to   { transform: translateY(120vh) rotate(1080deg); }
    }

    /* Botón */
    .btn {
      padding: 16px 40px;
      font-size: 1.3rem;
      background: #ff3366;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 50, 100, 0.5);
      transition: all 0.3s;
      margin-top: 1.5em;
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.08);
      background: #ff1a53;
      box-shadow: 0 15px 35px rgba(255, 50, 100, 0.7);
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #fff, 0 0 20px #ff4d88; }
      to   { text-shadow: 0 0 20px #fff, 0 0 40px #ff1a53, 0 0 60px #ff3366; }
    }

    @media (max-width: 500px) {
      .heart {
        width: 100px;
        height: 95px;
      }
      .heart::before,
      .heart::after {
        width: 100px;
        height: 95px;
      }
      .heart::before { top: -50px; }
      .heart::after { left: 50px; }
    }
  </style>
</head>

<body>

<div class="petals" id="petalsContainer"></div>

<div class="container">
  <h1>Feliz</h1>
  <h1>Happy Valentine's Day</h1>

  <div class="name">Mafer</div>

  <div class="message">
    Eres mi persona favorita en todo el universo,<br>
    cada día contigo se siente como un sueño del que nunca quiero despertar.<br><br>
    Gracias por hacerme tan feliz… te amo con todo mi corazón ♥
  </div>

  <div class="heart-container">
    <div class="heart"></div>
  </div>

<button class="btn" id="photoBtn">Ver nuestra foto ♥</button>
</div>

<script>
  function createPetals() {
    const container = document.getElementById("petalsContainer");
    for (let i = 0; i < 50; i++) {
      const petal = document.createElement("div");
      petal.className = "petal";

      const size = Math.random() * 12 + 8;
      petal.style.width = size + "px";
      petal.style.height = size + "px";

      petal.style.left = Math.random() * 100 + "vw";
      petal.style.top = Math.random() * -50 + "vh";

      const duration = Math.random() * 12 + 10;
      petal.style.animationDuration = duration + "s";

      container.appendChild(petal);

      setTimeout(() => petal.remove(), (duration + 5) * 1000);
    }
  }

    let petalsStarted = false;

    function startPetalsOnce() {
    if (petalsStarted) return;
    petalsStarted = true;
    createPetals();
    setInterval(createPetals, 15000);
    }

    // Para PC
    window.addEventListener("load", startPetalsOnce);

    // Para WhatsApp / móvil
    document.addEventListener("touchstart", startPetalsOnce, { once: true });
    document.addEventListener("click", startPetalsOnce, { once: true });
